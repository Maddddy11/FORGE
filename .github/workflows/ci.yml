name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — Lint, Test & SAST
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Test
        run: pytest -q
        env:
          JWT_SECRET_KEY: ci-secret-not-for-prod
          GROQ_API_KEY: ""   # mocked in conftest — no real calls in CI

      - name: SAST (bandit)
        run: bandit -r app -ll -q -c ../../.bandit

  web:
    name: Web — Lint & Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Dependency audit
        run: npm audit --audit-level=high

  container:
    name: Container — Trivy Image Scan
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t imam-lite-api:ci ./apps/api

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: imam-lite-api:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
